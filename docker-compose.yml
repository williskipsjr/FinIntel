services:
  postgres:
    image: postgres:16
    container_name: finintel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finintel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  postgres-init:
    image: postgres:16
    container_name: finintel-postgres-init
    environment:
      PGPASSWORD: postgres
    command: >
      sh -c "psql -h postgres -U postgres -d finintel -v ON_ERROR_STOP=1 -f /schema/init_postgres.sql"
    volumes:
      - ./scripts/init_postgres.sql:/schema/init_postgres.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  neo4j:
    image: neo4j:5
    container_name: finintel-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ocr:
    image: finintel-ml-services:latest
    build:
      context: ./ml-services
      dockerfile: Dockerfile
    container_name: finintel-ocr
    working_dir: /app/ml-services/ocr
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - statement_storage:/app/backend/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  standardize:
    image: finintel-ml-services:latest
    container_name: finintel-standardize
    working_dir: /app/ml-services/standardize
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  entity:
    image: finintel-ml-services:latest
    container_name: finintel-entity
    working_dir: /app/ml-services/entity
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  validation:
    image: finintel-ml-services:latest
    container_name: finintel-validation
    working_dir: /app/ml-services/validation
    command: uvicorn main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  graph:
    image: finintel-ml-services:latest
    container_name: finintel-graph
    working_dir: /app/ml-services/graph
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    environment: &ml-db-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: finintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ANOMALY_URL: http://anomaly:8007
      TEMPORAL_URL: http://temporal:8008
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  anomaly:
    image: finintel-ml-services:latest
    container_name: finintel-anomaly
    working_dir: /app/ml-services/anomaly
    command: uvicorn main:app --host 0.0.0.0 --port 8007
    environment:
      <<: *ml-db-env
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  temporal:
    image: finintel-ml-services:latest
    container_name: finintel-temporal
    working_dir: /app/ml-services/temporal
    command: uvicorn main:app --host 0.0.0.0 --port 8008
    environment:
      <<: *ml-db-env
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  trail:
    image: finintel-ml-services:latest
    container_name: finintel-trail
    working_dir: /app/ml-services/trail
    command: uvicorn main:app --host 0.0.0.0 --port 8009
    environment:
      <<: *ml-db-env
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  report:
    image: finintel-ml-services:latest
    container_name: finintel-report
    working_dir: /app/ml-services/report
    command: uvicorn main:app --host 0.0.0.0 --port 8010
    environment:
      <<: *ml-db-env
      GRAPH_URL: http://graph:8005
      TRAIL_URL: http://trail:8009
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      graph:
        condition: service_healthy
      trail:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    image: finintel-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finintel-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finintel
      OCR_URL: http://ocr:8001
      STANDARDIZE_URL: http://standardize:8002
      ENTITY_URL: http://entity:8003
      VALIDATION_URL: http://validation:8004
      GRAPH_URL: http://graph:8005
      ANOMALY_URL: http://anomaly:8007
      TEMPORAL_URL: http://temporal:8008
      TRAIL_URL: http://trail:8009
      REPORT_URL: http://report:8010
    ports:
      - "8080:8080"
    volumes:
      - statement_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
      standardize:
        condition: service_healthy
      entity:
        condition: service_healthy
      validation:
        condition: service_healthy
      graph:
        condition: service_healthy
      anomaly:
        condition: service_healthy
      temporal:
        condition: service_healthy
      trail:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    image: finintel-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finintel-frontend
    environment:
      VITE_FININTEL_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
  neo4j_data:
  statement_storage:
